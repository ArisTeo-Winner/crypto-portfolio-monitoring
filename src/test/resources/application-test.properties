app.frontend-base-url=http://localhost:3000
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
portfolio.price-update.enabled=false

# Fail fast (evita backoff eterno y Surefire kill)
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.leak-detection-threshold=5000

# Hibernate auto DDL
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

spring.cache.type=simple
security.refresh-token-hash-secret-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# Evita bloqueo cruzado entre tests de integracion que comparten contexto.
security.login-rate-limit.enabled=false
security.asset-search-rate-limit.enabled=true
security.asset-search-rate-limit.max-attempts=30
security.asset-search-rate-limit.window-seconds=60
security.asset-search-rate-limit.cleanup-interval-seconds=1
security.crypto-price-rate-limit.enabled=true
security.crypto-price-rate-limit.max-attempts=60
security.crypto-price-rate-limit.window-seconds=60
security.crypto-price-rate-limit.cleanup-interval-seconds=1

# Disable automatic execution of schema.sql and data.sql
spring.sql.init.mode=never


##spring.test.database.replace=none

# Show SQL in console (opcional para debug)
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

##logging.level.org.hibernate.SQL=DEBUG

# H2 console (opcional)
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

dotenv.enabled=false

API_COINMARKETCAP_BASE_URL=${API_COINMARKETCAP_BASE_URL}
API_COINMARKETCAP_API_KEY=demo

external.providers.coinmarketcap.base-url=${API_COINMARKETCAP_BASE_URL}
external.providers.coinmarketcap.api-key=demo
external.providers.coinmarketcap.cache-ttl=15s
external.providers.coinmarketcap.default-convert=USD
external.providers.coinmarketcap.enabled=true

API_ALPHAVANTAGE_BASE_URL=${API_ALPHAVANTAGE_BASE_URL}
API_ALPHAVANTAGE_API_KEY=demo

polygon.api.key=${POLYGON_API_KEY}

# 1) Cache interceptor de Spring (cache-aside)
#logging.level.org.springframework.cache.interceptor.CacheInterceptor=TRACE

#logging.level.org.springframework.cache=TRACE

#logging.level.org.springframework.data.redis.cache=DEBUG

# OAuth2 dummy registration for exposing endpoints
spring.security.oauth2.client.registration.google.client-id=test-id
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost/login/oauth2/code/google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

