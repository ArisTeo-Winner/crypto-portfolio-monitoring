
services:
  java_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_LOCAL_PORT:-5432}:5432"
    networks:
      - app_network
    volumes: 
      - shared_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "${REDIS_LOCAL_PORT:-6379}:6379"
    networks:
      - app_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s


  java_app:
    build:
      context: .
      dockerfile: dockerfile
    depends_on:
      java_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://java_db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USER}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASS}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64}
      REFRESH_TOKEN_HASH_SECRET_BASE64: ${REFRESH_TOKEN_HASH_SECRET_BASE64}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}

      API_COINMARKETCAP_BASE_URL: ${API_COINMARKETCAP_BASE_URL}
      COINMARKETCAP_API_KEY: ${COINMARKETCAP_API_KEY}
      API_COINGECKO_BASE_URL: ${API_COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      API_ALPHAVANTAGE_BASE_URL: ${API_ALPHAVANTAGE_BASE_URL}
      API_ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY}
      API_MASSIVE_BASE_URL: ${API_MASSIVE_BASE_URL}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY}
      POLYGON_API_KEY: ${POLYGON_API_KEY}
      POLYGON_BASE_URL: ${POLYGON_BASE_URL}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
      API_TWELVEDATA_BASE_URL: ${API_TWELVEDATA_BASE_URL:-https://api.twelvedata.com}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FINNHUB_BASE_URL: ${FINNHUB_BASE_URL:-https://finnhub.io/api/v1}
      BANXICO_BASE_URL: ${BANXICO_BASE_URL:-https://www.banxico.org.mx}
      BANXICO_TOKEN: ${BANXICO_TOKEN}
      BANXICO_CURVE_REFRESH_ENABLED: ${BANXICO_CURVE_REFRESH_ENABLED:-true}
      DATABURSATIL_BASE_URL: ${DATABURSATIL_BASE_URL:-https://api.databursatil.com}
      DATABURSATIL_TOKEN: ${DATABURSATIL_TOKEN:-}
      ASSET_LOGO_CACHE_TTL: ${ASSET_LOGO_CACHE_TTL:-PT24H}

      MENSSEGER_ASSETS: ${MENSSEGER_ASSETS}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    networks:
      - app_network
    ports:
      - "${APP_HOST_PORT:-8080}:8080"

networks:
  app_network:

volumes:
  shared_pg_data:
  redis_data:
