# application-prod.properties
# Cookie HttpOnly del refresh token
# Secure=true obliga HTTPS — no cambiar en producción
app.refresh-token.ttl-days=30
app.cookie.secure=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway must be strict in production. Enable baseline-on-migrate only for a supervised one-time legacy import.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.user=${FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USER}}}
spring.flyway.password=${FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASS}}}

spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}

management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.tracing.sampling.probability=0.1

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.mx.cryptomonitor=INFO
