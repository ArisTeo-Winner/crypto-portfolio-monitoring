# application-staging.properties
# -----------------------------------------------------------------------------
# STAGING = postura de PROD (seguridad + base de datos) con visibilidad de DEV,
# para cazar problemas de produccion ANTES de prod. Sin secretos: todo valor
# sensible entra por ${ENV} desde el dashboard de Render (servicio staging).
# Activar con: SPRING_PROFILES_ACTIVE=staging
# -----------------------------------------------------------------------------

# --- Seguridad: igual que prod (Render staging sirve por HTTPS) ---
# Si tu staging NO es HTTPS, cambia app.cookie.secure a false.
app.refresh-token.ttl-days=30
app.cookie.secure=true

# --- Base de datos / migraciones: estricto como prod ---
# ddl-auto=validate (NUNCA update en staging: se prueba el path real de Flyway).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.user=${FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USER}}}
spring.flyway.password=${FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASS}}}

spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}

# --- Observabilidad: MAS que prod, para depurar ---
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.mx.cryptomonitor=DEBUG

# Health con detalle (en prod es 'never'); util para diagnosticar en staging.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis

# Trazar TODAS las requests en staging (en prod es 0.1).
management.tracing.sampling.probability=1.0

# Errores con mensaje (en prod se ocultan). Stacktrace solo con ?trace=true.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Swagger ON en staging para probar la API (en prod va OFF).
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
