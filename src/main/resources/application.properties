server.port=${PORT:8080}
spring.application.name=crypto-portfolio-monitoring
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

msg.assets=${MENSSEGER_ASSETS}

jwt.secret-base64=${JWT_SECRET_BASE64}
security.refresh-token-hash-secret-base64=${REFRESH_TOKEN_HASH_SECRET_BASE64}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}
security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

spring.datasource.url=${SPRING_DATASOURCE_URL:${POSTGRES_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USER:${DB_USER}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASS:${DB_PASS}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true

spring.mvc.problemdetails.enabled=true
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=never
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.percentiles.http.client.requests=0.5,0.95,0.99
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# Rate limiting para registro de usuarios (/api/v1/users/register)
security.registration-rate-limit.enabled=true
security.registration-rate-limit.max-attempts=5
security.registration-rate-limit.window-seconds=600
security.registration-rate-limit.cleanup-interval-seconds=300

# Rate limiting para login de usuarios (/api/v1/auth/login)
security.login-rate-limit.enabled=true
security.login-rate-limit.max-attempts=10
security.login-rate-limit.window-seconds=60
security.login-rate-limit.block-seconds=300
security.login-rate-limit.cleanup-interval-seconds=300

# Rate limiting para busqueda publica de activos (/api/v1/assets/search)
security.asset-search-rate-limit.enabled=true
security.asset-search-rate-limit.max-attempts=30
security.asset-search-rate-limit.window-seconds=60
security.asset-search-rate-limit.cleanup-interval-seconds=60

# Rate limiting para cotizacion publica de cripto (/api/v1/crypto/{symbol}/price)
security.crypto-price-rate-limit.enabled=true
security.crypto-price-rate-limit.max-attempts=60
security.crypto-price-rate-limit.window-seconds=60
security.crypto-price-rate-limit.cleanup-interval-seconds=60

# Configuracion de HikariCP. En produccion debe ajustarse junto con max_connections de PostgreSQL.
spring.datasource.hikari.pool-name=${DB_POOL_NAME:CryptoPortfolioHikariPool}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME_MS:0}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_THRESHOLD_MS:0}
spring.datasource.hikari.initialization-fail-timeout=${DB_INITIALIZATION_FAIL_TIMEOUT_MS:1}

spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=2s

transaction.idempotency.ttl=7d

external.providers.coinmarketcap.base-url=${API_COINMARKETCAP_BASE_URL:https://pro-api.coinmarketcap.com}
external.providers.coinmarketcap.api-key=${COINMARKETCAP_API_KEY}
external.providers.coinmarketcap.cache-ttl=15s
external.providers.coinmarketcap.default-convert=USD
external.providers.coinmarketcap.enabled=true
external.providers.coingecko.base-url=${API_COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}
external.providers.coingecko.api-key=${COINGECKO_API_KEY:}
external.providers.coingecko.cache-ttl=15m
external.providers.coingecko.enabled=true

API_ALPHAVANTAGE_BASE_URL=${API_ALPHAVANTAGE_BASE_URL}
API_ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}

polygon.api.key=${POLYGON_API_KEY}
polygon.base-url=${POLYGON_BASE_URL}

# Twelve Data — proveedor primario de stocks (real-time y historico)
# Plan gratuito: 800 req/dia, 8 req/min. https://twelvedata.com
marketdata.twelvedata.base-url=${API_TWELVEDATA_BASE_URL:https://api.twelvedata.com}
marketdata.twelvedata.api-key=${TWELVEDATA_API_KEY:}

marketdata.alphavantage.base-url=${API_ALPHAVANTAGE_BASE_URL}
marketdata.alphavantage.api-key=${API_ALPHAVANTAGE_API_KEY:${ALPHAVANTAGE_API_KEY}}
marketdata.massive.base-url=${API_MASSIVE_BASE_URL:}
marketdata.massive.api-key=${MASSIVE_API_KEY:}

#logging.level.org.springframework.cache=TRACE

# Configuracion de OAuth2 Client
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

